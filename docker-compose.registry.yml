services:

  db:
    image: postgres:16-alpine
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB:-airquality}
      POSTGRES_USER: ${POSTGRES_USER:-airquality}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}

    volumes:
      - db-data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-airquality} -d ${POSTGRES_DB:-airquality}"
        ]
      interval: 5s
      timeout: 5s
      retries: 10


  backend:
    image: ghcr.io/leongritsyuk/air-quality-dashboard-backend:latest

    restart: unless-stopped

    depends_on:
      db:
        condition: service_healthy

    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432

      POSTGRES_DB: ${POSTGRES_DB:-airquality}
      POSTGRES_USER: ${POSTGRES_USER:-airquality}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}

      SENSOR_URL: ${SENSOR_URL}

      COLLECTION_INTERVAL_SECONDS: ${COLLECTION_INTERVAL_SECONDS:-900}

      TIMEZONE: ${TIMEZONE:-Europe/Prague}

      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080}

      LOG_LEVEL: ${LOG_LEVEL:-INFO}

      STORE_RAW_PAYLOAD: ${STORE_RAW_PAYLOAD:-true}

    ports:
      - "${BACKEND_PORT:-8000}:8000"

    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import httpx; httpx.get('http://localhost:8000/api/health', timeout=3).raise_for_status()"
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s


  frontend:
    image: ghcr.io/leongritsyuk/air-quality-dashboard-frontend:latest

    restart: unless-stopped

    depends_on:
      - backend

    ports:
      - "${FRONTEND_PORT:-8080}:8080"


volumes:
  db-data: